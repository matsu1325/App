<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12151d">
<title>人物仕立所</title>
<style>
:root{
  --sumi:#12151d;
  --nuno:#191e28;
  --nuno2:#222937;
  --line:#39424f;
  --chalk:#e6e9ef;
  --dim:#96a0b0;
  --brass:#c8a04a;
  --akane:#a55159;
  --disp:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --body:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,"Courier New",monospace;
  --pad:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--sumi);
  color:var(--chalk);
  font-family:var(--body);
  font-size:15px;line-height:1.7;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(84px + var(--pad));
}
/* 型紙の罫 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:
    repeating-linear-gradient(0deg,transparent 0 39px,rgba(230,233,239,.035) 39px 40px),
    repeating-linear-gradient(90deg,transparent 0 39px,rgba(230,233,239,.035) 39px 40px);
}
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,#12151d 70%,rgba(18,21,29,.86));
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;
}
.brand{display:flex;align-items:baseline;gap:10px}
h1{
  font-family:var(--disp);font-weight:600;font-size:21px;letter-spacing:.28em;
  margin:0;text-indent:.28em;
}
.tagline{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);margin-left:auto}
nav{display:flex;gap:2px;margin-top:8px}
nav button{
  flex:1;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--dim);font-family:var(--disp);font-size:15px;letter-spacing:.18em;
  padding:9px 0 8px;cursor:pointer;
}
nav button .n{font-family:var(--mono);font-size:9px;letter-spacing:.1em;display:block;opacity:.7;letter-spacing:.08em}
nav button[aria-selected="true"]{color:var(--brass);border-bottom-color:var(--brass)}
main{position:relative;z-index:1;padding:14px 12px 24px;max-width:720px;margin:0 auto}
.view{display:none}
.view.on{display:block}

/* ── 名簿 ── */
.roster-head{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.roster-head .cnt{font-family:var(--mono);font-size:11px;color:var(--dim)}
.card{
  position:relative;display:flex;gap:0;margin-bottom:12px;
  background:var(--nuno);border:1px solid var(--line);border-radius:3px;overflow:hidden;
  background-image:repeating-linear-gradient(0deg,transparent 0 23px,rgba(230,233,239,.03) 23px 24px);
}
.seam{
  width:34px;flex:none;border-right:1px dashed var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:rgba(200,160,74,.05);
}
.seam .no{font-family:var(--mono);font-size:12px;color:var(--brass);letter-spacing:.05em}
.seam .notch{width:9px;height:9px;border:1px solid var(--line);transform:rotate(45deg)}
.card-body{flex:1;min-width:0;padding:11px 12px 12px}
.card-name{font-family:var(--disp);font-size:18px;letter-spacing:.06em;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-name.empty{color:var(--dim)}
.card-sub{font-size:12px;color:var(--dim);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 巻尺ゲージ */
.tape{margin-top:9px;height:16px;position:relative;border:1px solid var(--line);border-radius:2px;background:#141924;overflow:hidden}
.tape .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,rgba(200,160,74,.55),rgba(200,160,74,.22));width:0}
.tape .ticks{position:absolute;inset:0;
  background:
    repeating-linear-gradient(90deg,rgba(230,233,239,.30) 0 1px,transparent 1px 20px),
    repeating-linear-gradient(90deg,rgba(230,233,239,.14) 0 1px,transparent 1px 4px);
  background-size:100% 9px,100% 5px;background-repeat:repeat-x;background-position:0 0,0 0;
}
.tape .pct{position:absolute;right:5px;bottom:0;font-family:var(--mono);font-size:9.5px;line-height:14px;color:var(--chalk);letter-spacing:.04em;text-shadow:0 0 4px #141924}
.card-acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
button.mini{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  background:none;color:var(--dim);border:1px solid var(--line);border-radius:2px;
  padding:5px 9px;cursor:pointer;
}
button.mini:active{background:var(--nuno2)}
button.mini.warn{color:var(--akane);border-color:rgba(165,81,89,.5)}
.add{
  display:block;width:100%;padding:13px;margin-top:4px;cursor:pointer;
  background:none;border:1px dashed var(--line);border-radius:3px;color:var(--brass);
  font-family:var(--disp);font-size:15px;letter-spacing:.2em;
}
.empty-note{border:1px dashed var(--line);border-radius:3px;padding:22px 16px;text-align:center;color:var(--dim);margin-bottom:12px}
.empty-note b{display:block;font-family:var(--disp);color:var(--chalk);font-size:16px;letter-spacing:.1em;margin-bottom:6px;font-weight:500}

/* ── 仕立（編集） ── */
.picker{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.picker button{
  flex:none;background:var(--nuno);border:1px solid var(--line);color:var(--dim);
  border-radius:2px;padding:6px 11px;font-size:13px;cursor:pointer;max-width:44vw;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--disp);letter-spacing:.05em;
}
.picker button[aria-current="true"]{color:var(--sumi);background:var(--brass);border-color:var(--brass);font-weight:600}
details.sec{border:1px solid var(--line);border-radius:3px;background:var(--nuno);margin-bottom:9px}
details.sec[open]{background:var(--nuno)}
summary.sec-h{
  list-style:none;cursor:pointer;padding:11px 13px;display:flex;align-items:baseline;gap:9px;
}
summary.sec-h::-webkit-details-marker{display:none}
summary.sec-h .jp{font-family:var(--disp);font-size:16px;letter-spacing:.16em}
summary.sec-h .yomi{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.1em}
summary.sec-h .fill-n{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--brass)}
summary.sec-h .car{color:var(--dim);font-size:11px;transition:transform .18s}
details[open] summary.sec-h .car{transform:rotate(90deg)}
.sec-in{padding:2px 13px 14px;border-top:1px dashed var(--line)}
.f{margin-top:13px}
.f-l{display:flex;align-items:baseline;gap:7px;margin-bottom:5px}
.f-l label{font-size:13px;letter-spacing:.08em;color:var(--chalk)}
.f-l .hint{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
input[type=text],textarea{
  width:100%;background:#141924;border:1px solid var(--line);border-radius:2px;
  color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.6;
  padding:8px 9px;outline:none;
}
input[type=text]:focus,textarea:focus{border-color:var(--brass);box-shadow:0 0 0 1px rgba(200,160,74,.3)}
textarea{resize:vertical;min-height:74px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{
  background:none;border:1px solid var(--line);border-radius:11px;color:var(--dim);
  font-size:12.5px;padding:3px 10px;cursor:pointer;font-family:var(--body);
}
.chip[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:rgba(200,160,74,.1)}
.chip.more{border-style:dashed;color:var(--brass);opacity:.85}
.chips.rest{margin-top:5px;padding-top:6px;border-top:1px dotted var(--line)}
/* 縁（関係） */
.rel{border:1px solid var(--line);border-radius:2px;padding:9px 10px 11px;margin-top:10px;background:#141924}
.rel .row{display:flex;gap:7px}
.rel .row>div{flex:1;min-width:0}
.rel .row+.row{margin-top:7px}
.rel .rm{margin-top:8px}
.tiny-l{font-family:var(--mono);font-size:9.5px;color:var(--dim);display:block;margin-bottom:3px;letter-spacing:.06em}

/* ── 台本（出力） ── */
.opt-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.opt-row .lbl{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.1em;width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{
  background:none;border:0;border-right:1px solid var(--line);color:var(--dim);
  padding:7px 12px;font-size:13px;cursor:pointer;font-family:var(--body);
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brass);color:var(--sumi);font-weight:600}
pre.out{
  background:#0e1219;border:1px solid var(--line);border-radius:3px;
  padding:12px;font-family:var(--mono);font-size:11.5px;line-height:1.75;
  white-space:pre-wrap;word-break:break-word;color:#cfd6e2;max-height:56vh;overflow:auto;margin:0;
}
.big-acts{display:flex;gap:7px;margin:11px 0 4px;flex-wrap:wrap}
button.act{
  flex:1;min-width:110px;background:none;border:1px solid var(--brass);color:var(--brass);
  border-radius:2px;padding:11px 8px;font-family:var(--disp);font-size:14px;letter-spacing:.14em;cursor:pointer;
}
button.act:active{background:rgba(200,160,74,.14)}
button.act.sub{border-color:var(--line);color:var(--dim)}
.io{margin-top:22px;border-top:1px dashed var(--line);padding-top:16px}
.io h2,.sec-title{font-family:var(--disp);font-size:15px;letter-spacing:.18em;margin:0 0 4px;font-weight:500}
.io p{font-size:12px;color:var(--dim);margin:0 0 9px}
.file-btn{display:inline-block;border:1px solid var(--line);border-radius:2px;padding:8px 12px;
  font-family:var(--mono);font-size:11px;color:var(--dim);cursor:pointer}
input[type=file]{display:none}
footer{color:var(--dim);font-family:var(--mono);font-size:10px;text-align:center;padding:26px 0 6px;letter-spacing:.08em}
/* トースト */
#toast{
  position:fixed;left:50%;bottom:calc(22px + var(--pad));transform:translateX(-50%) translateY(12px);
  background:var(--nuno2);border:1px solid var(--brass);color:var(--chalk);
  padding:9px 16px;border-radius:2px;font-size:13px;z-index:60;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:88vw;text-align:center;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>人物仕立所</h1>
    <span class="tagline">CHARACTER ATELIER</span>
  </div>
  <nav role="tablist">
    <button role="tab" id="tab-roster" aria-selected="true" data-v="roster">名簿<span class="n">ROSTER</span></button>
    <button role="tab" id="tab-edit" aria-selected="false" data-v="edit">仕立<span class="n">TAILOR</span></button>
    <button role="tab" id="tab-out" aria-selected="false" data-v="out">台本<span class="n">EXPORT</span></button>
  </nav>
</header>

<main>
  <section class="view on" id="v-roster">
    <div class="roster-head"><span class="sec-title">仕立て中の人物</span><span class="cnt" id="cnt"></span></div>
    <div id="roster"></div>
    <button class="add" id="btn-add">＋ 人物を起こす</button>
    <div class="big-acts" style="margin-top:14px">
      <button class="act sub" id="btn-sample">見本を入れる</button>
      <button class="act sub" id="btn-clear">全部ほどく</button>
    </div>
  </section>

  <section class="view" id="v-edit">
    <div class="picker" id="picker"></div>
    <div id="editor"></div>
  </section>

  <section class="view" id="v-out">
    <div class="opt-row">
      <span class="lbl">書式</span>
      <div class="seg" id="seg-fmt">
        <button data-f="full" aria-pressed="true">詳細</button>
        <button data-f="brief" aria-pressed="false">簡潔</button>
        <button data-f="script" aria-pressed="false">台本用</button>
      </div>
    </div>
    <div class="opt-row">
      <span class="lbl">範囲</span>
      <div class="seg" id="seg-scope">
        <button data-s="all" aria-pressed="true">全員</button>
        <button data-s="one" aria-pressed="false">選択中の一人</button>
      </div>
    </div>
    <pre class="out" id="out"></pre>
    <div class="big-acts">
      <button class="act" id="btn-copy">コピー</button>
      <button class="act" id="btn-dl">.md で保存</button>
    </div>
    <div class="io">
      <h2>読み込み</h2>
      <p>この所で書き出した .md を貼れば、そのまま続きを仕立てられます。書き出し文の末尾には人物データが注記として埋め込んであり、他のアプリでは表示されません。</p>
      <textarea id="imp" placeholder="ここにマークダウンを貼る"></textarea>
      <div class="big-acts">
        <button class="act sub" id="btn-imp">貼った文を読む</button>
        <label class="act sub" for="file" style="text-align:center;line-height:1.4">ファイルを選ぶ
          <input type="file" id="file" accept=".md,.markdown,.txt,text/markdown,text/plain"></label>
      </div>
    </div>
    <footer>人物仕立所 ／ 単票形式 rp-character v1</footer>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

/* ============ 状態と保存 ============ */
const store={
  async get(k){
    try{ if(window.storage){const r=await window.storage.get(k,false); return r?r.value:null;} }catch(e){}
    try{ return localStorage.getItem(k); }catch(e){ return null; }
  },
  async set(k,v){
    try{ if(window.storage){ await window.storage.set(k,v,false); return; } }catch(e){}
    try{ localStorage.setItem(k,v); }catch(e){}
  }
};
const KEY="jinbutsu-shitatejo-v1";

let fmt="full", scope="all", saveTimer=null;

function uid(){return Math.random().toString(36).slice(2,9)}
function newChar(){const c={id:uid(),v:{},rels:[]};return c}
function cur(){return S.chars[S.sel]||null}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{store.set(KEY,JSON.stringify(S))},250);
}
async function load(){
  const raw=await store.get(KEY);
  if(raw){ try{ const d=JSON.parse(raw); if(d&&Array.isArray(d.chars)){S.chars=d.chars.map(normalize);S.sel=Math.min(d.sel||0,Math.max(0,S.chars.length-1));} }catch(e){} }
  renderAll();
}
function normalize(c){
  return {id:c.id||uid(), v:c.v&&typeof c.v==="object"?c.v:{}, rels:Array.isArray(c.rels)?c.rels:[]};
}
function nameOf(c){return (c.v.name||"").trim()}
function subOf(c){
  const p=[c.v.age&&(/^\d+$/.test(c.v.age.trim())?c.v.age.trim()+"歳":c.v.age),c.v.sex,c.v.role].filter(Boolean);
  return p.join("／")||"まだ何も決まっていない";
}
function totalFields(){return SCHEMA.reduce((n,s)=>n+s.fields.length,0)}
function filledCount(c){let n=0;SCHEMA.forEach(s=>s.fields.forEach(f=>{if((c.v[f.id]||"").trim())n++}));return n}
function secFilled(c,s){let n=0;s.fields.forEach(f=>{if((c.v[f.id]||"").trim())n++});return n}

function fieldHTML(c,s,f){
  const val=c.v[f.id]||"";
  const tokens=splitTokens(val);
  const input=f.t==="area"
    ? `<textarea data-f="${f.id}" placeholder="${esc(f.ph||"")}">${esc(val)}</textarea>`
    : `<input type="text" data-f="${f.id}" value="${esc(val)}" placeholder="${esc(f.ph||"")}">`;
  const cb=o=>`<button class="chip" data-chip="${esc(o)}" data-f="${f.id}" aria-pressed="${tokens.includes(o)}">${esc(o)}</button>`;
  const HEAD=14, all=f.o||[];
  let chips="";
  if(all.length){
    const hidden=all.slice(HEAD).filter(o=>!tokens.includes(o));
    const shown=all.slice(0,HEAD).concat(all.slice(HEAD).filter(o=>tokens.includes(o)));
    chips=`<div class="chips">${shown.map(cb).join("")}`
      +(hidden.length?`<button class="chip more" data-more="${f.id}">＋他${hidden.length}</button>`:"")+`</div>`
      +(hidden.length?`<div class="chips rest" data-rest="${f.id}" hidden>${hidden.map(cb).join("")}</div>`:"");
  }
  return `<div class="f" data-fw="${f.id}">
    <div class="f-l"><label>${esc(f.l)}</label>${f.o?'<span class="hint">選ぶ・書く</span>':'<span class="hint">書く</span>'}</div>
    ${input}${chips}</div>`;
}

function splitTokens(v){return String(v).split(/[、,]/).map(x=>x.trim()).filter(Boolean)}
function toggleToken(v,t){
  const a=splitTokens(v), i=a.indexOf(t);
  if(i>=0)a.splice(i,1); else a.push(t);
  return a.join("、");
}
$("editor").addEventListener("input",e=>{
  const c=cur(); if(!c)return;
  const t=e.target;
  if(t.dataset.f){
    c.v[t.dataset.f]=t.value; save(); syncChips(t.dataset.f,t.value); refreshCount(t);
  }else if(t.dataset.rk){
    const wrap=t.closest(".rel"); const i=+wrap.dataset.ri;
    c.rels[i][t.dataset.rk]=t.value; save();
    if(t.dataset.rk==="tie"||t.dataset.rk==="feel"){
      wrap.querySelectorAll(`[data-relchip="${t.dataset.rk}"]`).forEach(ch=>
        ch.setAttribute("aria-pressed",String(splitTokens(t.value).includes(ch.dataset.v))));
    }
  }
});
function syncChips(fid,val){
  const toks=splitTokens(val);
  document.querySelectorAll(`#editor .chip[data-f="${fid}"]`).forEach(ch=>
    ch.setAttribute("aria-pressed",String(toks.includes(ch.dataset.chip))));
}
function refreshCount(el){
  const d=el.closest("details.sec"); if(!d)return;
  const s=SCHEMA.find(x=>x.id===d.dataset.s); if(!s)return;
  d.querySelector(".fill-n").textContent=secFilled(cur(),s)+"/"+s.fields.length;
  if((el.dataset.f)==="name")renderPicker();
}
$("editor").addEventListener("click",e=>{
  const c=cur(); if(!c)return;
  const more=e.target.closest("[data-more]");
  if(more){
    const rest=document.querySelector(`#editor .rest[data-rest="${more.dataset.more}"]`);
    if(rest){const now=rest.hasAttribute("hidden");
      if(now)rest.removeAttribute("hidden");else rest.setAttribute("hidden","");
      more.textContent=now?"－閉じる":`＋他${rest.children.length}`;}
    return;
  }
  const chip=e.target.closest(".chip[data-chip]");
  if(chip){
    const fid=chip.dataset.f;
    c.v[fid]=toggleToken(c.v[fid]||"",chip.dataset.chip);
    const inp=document.querySelector(`#editor [data-f="${fid}"]:not(.chip)`);
    if(inp)inp.value=c.v[fid];
    syncChips(fid,c.v[fid]); refreshCount(chip); save(); return;
  }
  const rc=e.target.closest(".chip[data-relchip]");
  if(rc){
    const i=+rc.dataset.ri,k=rc.dataset.relchip;
    c.rels[i][k]=toggleToken(c.rels[i][k]||"",rc.dataset.v);
    const wrap=document.querySelector(`.rel[data-ri="${i}"]`);
    wrap.querySelector(`[data-rk="${k}"]`).value=c.rels[i][k];
    wrap.querySelectorAll(`[data-relchip="${k}"]`).forEach(ch=>
      ch.setAttribute("aria-pressed",String(splitTokens(c.rels[i][k]).includes(ch.dataset.v))));
    save(); return;
  }
  const rm=e.target.closest("[data-relrm]");
  if(rm){ c.rels.splice(+rm.dataset.relrm,1); save(); renderEditor(); return; }
  if(e.target.id==="btn-rel"){ c.rels.push({who:"",tie:"",feel:"",note:""}); save(); renderEditor();
    const els=document.querySelectorAll(".rel"); if(els.length)els[els.length-1].scrollIntoView({block:"center"}); }
});

/* ============ 台本（マークダウン） ============ */
function mdFull(c,idx){
  const nm=nameOf(c)||"名無しの人物";
  let o=`# 人物設定書：${nm}\n\n`;
  if(c.v.yomi)o+=`> ${c.v.yomi}\n\n`;
  SCHEMA.forEach(s=>{
    const rows=s.fields.filter(f=>(c.v[f.id]||"").trim());
    if(!rows.length)return;
    o+=`## ${s.jp}\n`;
    rows.forEach(f=>{
      const v=(c.v[f.id]||"").trim();
      o+= v.includes("\n") ? `- **${f.l}**:\n${v.split("\n").map(l=>"  "+l).join("\n")}\n` : `- **${f.l}**: ${v}\n`;
    });
    o+="\n";
  });
  const rels=c.rels.filter(r=>(r.who||r.tie||r.feel||r.note));
  if(rels.length){
    o+=`## 縁\n| 相手 | 間柄 | 感情 | 経緯 |\n| --- | --- | --- | --- |\n`;
    rels.forEach(r=>{o+=`| ${cell(r.who)} | ${cell(r.tie)} | ${cell(r.feel)} | ${cell(r.note)} |\n`});
    o+="\n";
  }
  return o;
}
function cell(v){return String(v||"").replace(/\|/g,"\\|").replace(/\n/g,"　")||"—"}
function mdBrief(c){
  const nm=nameOf(c)||"名無しの人物";
  let o=`# ${nm}\n\n`;
  SCHEMA.forEach(s=>{
    const vals=s.fields.filter(f=>(c.v[f.id]||"").trim())
      .map(f=>`${f.l}＝${(c.v[f.id]||"").replace(/\n+/g,"　").trim()}`);
    if(vals.length)o+=`**${s.jp}**：${vals.join("／")}\n\n`;
  });
  const rels=c.rels.filter(r=>r.who||r.tie);
  if(rels.length)o+=`**縁**：${rels.map(r=>`${r.who||"？"}（${[r.tie,r.feel].filter(Boolean).join("・")||"関係未定"}）`).join("／")}\n\n`;
  return o;
}
function pick(c,ids){return ids.map(i=>(c.v[i]||"").replace(/\n+/g,"　").trim()).filter(Boolean).join("、")}
function mdScript(c){
  const nm=nameOf(c)||"名無しの人物";
  const L=[];
  const push=(k,v)=>{if(v&&v.trim())L.push(`- ${k}: ${v.trim()}`)};
  push("年齢・性別",pick(c,["age","sex","race"]));
  push("立場",pick(c,["role","belong","from"]));
  push("外見",pick(c,["height","build","hair","haircol","eye","skin","face","wear","mark"]));
  push("体格",pick(c,["bust","waist","hip"]));
  push("性格",pick(c,["person","merit","fault","emo","social","habit"]));
  push("価値観",pick(c,["value","want","fear"]));
  push("口調",[c.v.i?`一人称「${c.v.i}」`:"",c.v.you?`二人称「${c.v.you}」`:"",pick(c,["tone","end","voice"])].filter(Boolean).join("、"));
  push("決め台詞",(c.v.line||"").replace(/\n+/g,"　"));
  push("背景",pick(c,["birth","turn","work","family","now"]));
  push("技能",pick(c,["good","bad","power","combat","item"]));
  push("好悪",pick(c,["like","dislike","food","hobby"]));
  push("秘密",pick(c,["secret","wound","weak","hidden","face2"]));
  const rels=c.rels.filter(r=>r.who||r.tie);
  if(rels.length)push("関係",rels.map(r=>`${r.who||"？"}＝${[r.tie,r.feel,r.note].filter(Boolean).join("・").replace(/\n+/g,"　")}`).join("／"));
  push("演じ方",pick(c,["policy","first","dist"]));
  push("禁止事項",(c.v.ng||"").replace(/\n+/g,"　"));
  push("想定場面",(c.v.scene||"").replace(/\n+/g,"　"));
  push("備考",(c.v.free||"").replace(/\n+/g,"　"));
  return `## 人物：${nm}\n${L.join("\n")}\n\n`;
}
function buildMd(){
  const list = scope==="one" ? (cur()?[cur()]:[]) : S.chars;
  if(!list.length)return "";
  let body="";
  if(fmt==="script"){
    body=`# 登場人物\n\n`+list.map(mdScript).join("");
  }else{
    body=list.map((c,i)=>(fmt==="brief"?mdBrief(c):mdFull(c,i))).join("\n---\n\n");
  }
  const data={format:"rp-character/1",chars:list.map(c=>({v:c.v,rels:c.rels}))};
  return body.replace(/\n+$/,"\n")+`\n<!-- 人物仕立所 rp-character/1\n`+JSON.stringify(data)+`\n-->\n`;
}
function renderOut(){
  const md=buildMd();
  $("out").textContent=md||"まだ書き出すものがない。名簿から一人起こす。";
}
$("seg-fmt").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  fmt=b.dataset.f;[...e.currentTarget.children].forEach(x=>x.setAttribute("aria-pressed",String(x===b)));renderOut()});
$("seg-scope").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  scope=b.dataset.s;[...e.currentTarget.children].forEach(x=>x.setAttribute("aria-pressed",String(x===b)));renderOut()});
$("btn-copy").addEventListener("click",async()=>{
  const md=buildMd(); if(!md){toast("書き出すものがない");return}
  try{ await navigator.clipboard.writeText(md); toast("コピーした"); }
  catch(e){
    const ta=document.createElement("textarea");ta.value=md;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.focus();ta.select();
    try{document.execCommand("copy");toast("コピーした")}catch(e2){toast("コピーできない。長押しで選んで写す")}
    document.body.removeChild(ta);
  }
});
$("btn-dl").addEventListener("click",()=>{
  const md=buildMd(); if(!md){toast("書き出すものがない");return}
  const nm=(scope==="one"&&cur()?(nameOf(cur())||"人物"):"人物設定");
  const blob=new Blob([md],{type:"text/markdown;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nm+".md";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast("保存した");
});

/* ============ 読み込み ============ */
function parseMd(text){
  const m=text.match(/<!--\s*人物仕立所 rp-character\/1\s*([\s\S]*?)-->/);
  if(m){
    try{
      const d=JSON.parse(m[1].trim());
      if(d&&Array.isArray(d.chars))return d.chars.map(c=>normalize({v:c.v,rels:c.rels}));
    }catch(e){}
  }
  // 注記が無い場合は見出しと箇条書きから拾う
  const out=[]; let c=null, sec=null, inRel=false;
  text.split(/\r?\n/).forEach(line=>{
    let h=line.match(/^#\s*(?:人物設定書：)?(.+?)\s*$/);
    if(h&&!/^##/.test(line)){
      if(/^(登場人物|人物設定|キャラクター)$/.test(h[1]))return;
      c=normalize({}); c.v.name=h[1]; out.push(c); sec=null; inRel=false; return;
    }
    const h2=line.match(/^##\s*(人物[：:])?(.+?)\s*$/);
    if(h2){
      if(h2[1]){ c=normalize({}); c.v.name=h2[2]; out.push(c); sec=null; inRel=false; return; }
      sec=h2[2]; inRel=(sec==="縁"||sec==="関係"); return;
    }
    if(!c)return;
    // 簡潔形式：**素性**：名前＝…／年齢＝…
    const bl=line.match(/^\*\*(.+?)\*\*\s*[：:]\s*(.+)$/);
    if(bl){
      bl[2].split("／").forEach(pair=>{
        const kv=pair.split(/[＝=]/);
        if(kv.length>=2&&FIELD_BY_LABEL[kv[0].trim()])c.v[FIELD_BY_LABEL[kv[0].trim()][1]]=kv.slice(1).join("＝").trim();
      });
      return;
    }
    if(inRel&&/^\|/.test(line)){
      const cells=line.split("|").slice(1,-1).map(s=>s.trim());
      if(cells.length<4||/^-+$/.test(cells[0])||cells[0]==="相手")return;
      const r={who:cells[0],tie:cells[1],feel:cells[2],note:cells[3]};
      REL_KEYS.forEach(([k])=>{if(r[k]==="—")r[k]=""});
      if(r.who||r.tie||r.feel||r.note)c.rels.push(r);
      return;
    }
    const li=line.match(/^-\s*\*\*(.+?)\*\*\s*[:：]\s*(.*)$/);
    if(li){
      const key=FIELD_BY_LABEL[li[1]];
      if(key)c.v[key[1]]=li[2].trim();
      return;
    }
    const li2=line.match(/^-\s*(.+?)\s*[:：]\s*(.+)$/);
    if(li2&&FIELD_BY_LABEL[li2[1]])c.v[FIELD_BY_LABEL[li2[1]][1]]=li2[2].trim();
  });
  return out.filter(x=>Object.keys(x.v).length||x.rels.length);
}
function importText(text){
  const got=parseMd(text);
  if(!got.length){toast("人物が見つからない");return}
  const add=S.chars.length?confirm(got.length+"名を読み込みます。\nOK＝今の名簿に足す／キャンセル＝入れ替える"):true;
  if(add)S.chars=S.chars.concat(got); else S.chars=got;
  S.sel=S.chars.length-got.length;
  save();renderAll();showView("roster");toast(got.length+"名を読み込んだ");
}
$("btn-imp").addEventListener("click",()=>{
  const t=$("imp").value.trim();
  if(!t){toast("貼り付け欄が空");return}
  importText(t); $("imp").value="";
});
$("file").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>importText(String(r.result));
  r.onerror=()=>toast("ファイルを読めない");
  r.readAsText(f,"utf-8");
  e.target.value="";
});

function renderAll(){renderRoster();if($("v-edit").classList.contains("on"))renderEditor();if($("v-out").classList.contains("on"))renderOut()}
load();
