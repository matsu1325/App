<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>投函所</title>
<meta name="description" content="貼り付けたHTMLを台帳の書庫へ収める">
<meta name="theme-color" content="#0E1621">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<style>
:root{
  --ink:#0E1621; --ink-raised:#16212E; --rule:#24344A;
  --paper:#DCD3BE; --paper-dim:#7E8898;
  --brass:#C08A3E; --vermilion:#B23A2E; --verdigris:#4E8A82;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
  --gothic:"Hiragino Sans","Yu Gothic",YuGothic,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* hidden 属性は display 指定に負けるので、必ず勝たせる */
[hidden]{display:none!important}
body{
  margin:0;background:var(--ink);color:var(--paper);
  font-family:var(--gothic);font-size:15px;line-height:1.6;
  padding:calc(24px + env(safe-area-inset-top)) 18px
          calc(40px + env(safe-area-inset-bottom));
  max-width:680px;margin-inline:auto;
}
h1{font-family:var(--mincho);font-size:25px;font-weight:600;
   letter-spacing:.3em;margin:0;text-indent:.3em}
.romaji{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;
        color:var(--paper-dim);text-transform:uppercase;display:block;margin-top:6px}
.back{display:inline-block;margin-bottom:22px;color:var(--paper-dim);
      font-size:12px;text-decoration:none;letter-spacing:.08em}
.back:hover{color:var(--brass)}

fieldset{border:none;border-top:1px solid var(--rule);margin:26px 0 0;padding:18px 0 0}
legend{display:none}
.field{margin-bottom:16px}
label{display:block;font-family:var(--mincho);font-size:12px;
      letter-spacing:.18em;color:var(--paper-dim);margin-bottom:6px}
.hint{font-size:11.5px;color:#5C6878;margin:5px 0 0;line-height:1.55}
input,textarea{
  width:100%;background:var(--ink-raised);color:var(--paper);
  border:1px solid var(--rule);border-radius:1px;
  font-family:var(--mono);font-size:16px;padding:10px 11px;outline:none;
}
input:focus,textarea:focus{border-color:var(--brass)}
textarea{min-height:190px;resize:vertical;line-height:1.45;font-size:13px}
.row2{display:flex;gap:10px;align-items:flex-end}
.row2 .field{flex:1;margin-bottom:0}

button{
  font-family:var(--gothic);font-size:14px;letter-spacing:.12em;
  border-radius:1px;padding:13px 20px;cursor:pointer;
  border:1px solid var(--brass);background:var(--brass);color:var(--ink);
}
button.ghost{background:none;color:var(--paper-dim);border-color:var(--rule)}
button:disabled{opacity:.4;cursor:default}
.actions{display:flex;gap:10px;margin-top:22px}
.actions button{flex:1}

.preview{
  border:1px solid var(--rule);border-left:2px solid var(--vermilion);
  padding:13px 15px;margin-top:14px;background:var(--ink-raised);
}
.preview .pv-name{font-family:var(--mincho);font-size:18px;font-weight:600;margin:0 0 3px}
.preview .pv-desc{font-size:12.5px;color:var(--paper-dim);margin:0}
.preview .pv-meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
                  color:var(--verdigris);margin-top:7px}

#log{margin-top:20px;font-family:var(--mono);font-size:12px;line-height:1.75;
     white-space:pre-wrap;word-break:break-all}
#log .ok{color:var(--verdigris)}
#log .ng{color:var(--vermilion)}
#log .wait{color:var(--brass)}
#log a{color:var(--brass)}

.sep{display:flex;align-items:center;gap:10px;margin:22px 0;
     font-family:var(--mincho);font-size:11px;letter-spacing:.2em;color:var(--paper-dim)}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--rule)}

.filepick{display:block;border:1px dashed var(--rule);border-radius:2px;
  padding:18px 14px;text-align:center;cursor:pointer;color:var(--paper-dim);
  font-size:13px;letter-spacing:.05em;background:var(--ink-raised)}
.filepick:active{border-color:var(--brass)}
.filepick b{display:block;color:var(--paper);font-family:var(--mincho);
  font-size:15px;letter-spacing:.1em;margin-bottom:4px}
#filePick{display:none}

.queue{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.qitem{border:1px solid var(--rule);border-left:2px solid var(--vermilion);
  background:var(--ink-raised);padding:12px 13px}
.qitem.ok{border-left-color:var(--verdigris)}
.qitem.ng{border-left-color:var(--vermilion);opacity:.75}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qhead .qname{flex:1;min-width:0;font-family:var(--mincho);font-size:15px;
  font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qhead .qremove{flex:none;background:none;border:none;color:var(--paper-dim);
  font-family:var(--mono);font-size:15px;padding:2px 6px;cursor:pointer}
.qdesc{font-size:12px;color:var(--paper-dim);margin:0 0 8px}
.qfile{display:flex;align-items:baseline;gap:6px}
.qfile label{margin:0;flex:none;font-size:10.5px}
.qfile input{font-size:13px;padding:7px 9px}
.qstatus{margin-top:8px;font-family:var(--mono);font-size:11px;letter-spacing:.05em}
.qstatus.ok{color:var(--verdigris)}
.qstatus.ng{color:var(--vermilion)}
.qstatus.wait{color:var(--brass)}

.queue-actions{display:flex;gap:10px;margin-top:14px}
.queue-actions button{flex:1}

button.ghost.danger{color:var(--vermilion);border-color:rgba(178,58,46,.5)}

.inv{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.iitem{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border:1px solid var(--rule);background:var(--ink-raised);padding:10px 12px}
.iitem .iname{flex:1 1 auto;min-width:0;font-family:var(--mincho);font-size:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iitem .isize{flex:none;font-family:var(--mono);font-size:10.5px;color:var(--paper-dim)}
.iitem .iacts{flex:none;display:flex;gap:6px;width:100%}
.iitem .iacts button{padding:8px 12px;font-size:12.5px;flex:1}
.iitem.gone{opacity:.4}
</style>
</head>
<body>

<a class="back" href="./">← 台帳へ</a>
<h1>投函所</h1>
<span class="romaji">Deposit</span>

<fieldset>
  <legend>宛先</legend>
  <div class="field">
    <label for="repo">書庫</label>
    <input id="repo" placeholder="ユーザ名/リポジトリ名" autocapitalize="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="field">
    <label for="token">合鍵</label>
    <input id="token" type="password" placeholder="github_pat_…" autocapitalize="off" autocorrect="off" spellcheck="false">
    <p class="hint">Fine-grained token（対象リポジトリのみ／Contents: Read and write）。この端末の中だけに保存され、どこにも送りません。</p>
  </div>
</fieldset>

<fieldset>
  <legend>投函</legend>
  <div class="field">
    <label for="name">ファイル名</label>
    <input id="name" placeholder="ritsudo-kenpataku" autocapitalize="off" autocorrect="off" spellcheck="false">
    <p class="hint">拡張子は省略可。<code>apps/</code> の下に収まります。</p>
  </div>
  <div class="field">
    <label for="html">中身</label>
    <textarea id="html" placeholder="ここにHTMLを貼る" spellcheck="false"></textarea>
  </div>
  <div id="preview"></div>
  <div class="actions">
    <button class="ghost" id="paste">貼り付け</button>
    <button id="send" disabled>投函する</button>
  </div>

  <div class="sep">または</div>

  <div class="field">
    <label for="filePick">ファイルから選ぶ</label>
    <label class="filepick" id="filePickLabel" for="filePick">
      <b>ファイルを選ぶ</b>
      端末に保存したHTMLを選ぶ。複数まとめて選んでも良い。
    </label>
    <input type="file" id="filePick" accept=".html,.htm,text/html" multiple>
  </div>
  <ul class="queue" id="queue"></ul>
  <div class="queue-actions" id="queueActions" hidden>
    <button class="ghost" id="queueClear">リストを消す</button>
    <button id="queueSend">投函する</button>
  </div>
</fieldset>

<fieldset>
  <legend>在庫</legend>
  <div class="field">
    <button class="ghost" id="loadInv" type="button">一覧を読み込む</button>
    <p class="hint">書庫の <code>apps/</code> を読み出す。「更新」は同じ名前で新しい中身に差し替え、「削除」は取り消せない。</p>
  </div>
  <ul class="inv" id="inv"></ul>
</fieldset>

<div id="log"></div>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const KEY = 'kikai.post.v1';

/* 合鍵と書庫はこの端末にだけ残す */
const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })();
$('#repo').value = saved.repo || '';
$('#token').value = saved.token || '';

const persist = () => {
  try { localStorage.setItem(KEY, JSON.stringify({ repo: $('#repo').value.trim(), token: $('#token').value.trim() })); } catch {}
};
$('#repo').addEventListener('change', persist);
$('#token').addEventListener('change', persist);

/* ── 貼られたHTMLから台帳の見え方を先に示す ───────────── */

function readManifest(html){
  const m = html.match(/<script\b[^>]*id=["']app-manifest["'][^>]*>([\s\S]*?)<\/script>/i);
  if (m){ try { return JSON.parse(m[1].trim()); } catch { return { __broken:true }; } }
  return null;
}
const pickTitle = (h) => (h.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1] || '').trim();
const pickDesc  = (h) => (h.match(/<meta\b[^>]*name=["']description["'][^>]*content=["']([^"']*)["']/i)?.[1] || '').trim();

const slug = (s) => s.toLowerCase().replace(/[^\w\-]+/g,'-').replace(/^-+|-+$/g,'');

function refresh(){
  const html = $('#html').value;
  const box = $('#preview');

  if (!html.trim()){ box.innerHTML = ''; $('#send').disabled = true; return; }

  const mf = readManifest(html);
  const title = pickTitle(html);
  const name = mf?.name || title.split(/[|—–\-/／｜]/)[0].trim() || '（名称不明）';
  const desc = mf?.desc || pickDesc(html) || '摘要未記入';
  const cat  = mf?.category || '未分類';

  if (!$('#name').value.trim() && title){
    const d = new Date(), z = (n) => String(n).padStart(2,'0');
    $('#name').value = slug(title) || `kikai-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`;
  }

  box.innerHTML = `
    <div class="preview">
      <p class="pv-name">${esc(name)}</p>
      <p class="pv-desc">${esc(desc)}</p>
      <p class="pv-meta">${esc(cat)} ／ ${mf ? (mf.__broken ? 'app-manifest が壊れています' : 'app-manifest から取得')
                                              : 'title と description から代用'}</p>
    </div>`;
  $('#send').disabled = false;
}
const esc = (s) => String(s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('#html').addEventListener('input', refresh);

$('#paste').addEventListener('click', async () => {
  try {
    const t = await navigator.clipboard.readText();
    if (t){ $('#html').value = t; refresh(); }
    else say('ng','クリップボードが空です。');
  } catch {
    say('ng','クリップボードを読めません。テキスト欄に直接貼ってください。');
    $('#html').focus();
  }
});

/* ── 投函 ───────────────────────────────────────────── */

function say(cls, msg){
  const el = document.createElement('div');
  el.className = cls; el.innerHTML = msg;
  $('#log').appendChild(el);
}

const b64 = (str) => {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin);   // UTF-8 を確実に通す
};

async function api(repo, token, path, init = {}){
  return fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
    ...init,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(init.headers || {}),
    },
  });
}

/* 1件を投函する。成否をログに書きつつ返す（単発・まとめての両方から使う） */
async function deposit(repo, token, file, html){
  const path = 'apps/' + file;
  say('wait', `${path} を確認中…`);
  try {
    // 既にあれば sha を添えて上書き、無ければ新規
    let sha = null;
    const head = await api(repo, token, path);
    if (head.status === 200){
      sha = (await head.json()).sha;
      say('wait', `既存の器械を差し替えます： ${path}`);
    } else if (head.status === 404){
      say('wait', `新しい器械として収めます： ${path}`);
    } else if (head.status === 401){
      throw new Error('合鍵が通りません（401）。トークンを確認してください。');
    } else if (head.status === 403){
      throw new Error('権限が足りません（403）。トークンに Contents: Read and write を与えてください。');
    } else {
      throw new Error(`書庫を読めません（${head.status}）。書庫名を確認してください。`);
    }

    const res = await api(repo, token, path, {
      method:'PUT',
      body: JSON.stringify({
        message: `${sha ? '差替' : '収蔵'}: ${file}`,
        content: b64(html),
        ...(sha ? { sha } : {}),
      }),
    });

    if (!res.ok){
      const body = await res.json().catch(() => ({}));
      throw new Error(`${res.status} ${body.message || res.statusText}`);
    }

    const out = await res.json();
    say('ok', `投函しました： ${path}`);
    say('ok', `<a href="${out.content.html_url}" target="_blank" rel="noopener">GitHub で見る</a>`);
    return { ok:true, url: out.content.html_url };
  } catch (err) {
    say('ng', `${path} を投函できませんでした： ` + err.message);
    return { ok:false, error: err.message };
  }
}

$('#send').addEventListener('click', async () => {
  const repo  = $('#repo').value.trim();
  const token = $('#token').value.trim();
  const html  = $('#html').value;
  let file    = $('#name').value.trim();

  $('#log').innerHTML = '';

  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) return say('ng','書庫の書き方が違います。「ユーザ名/リポジトリ名」で入れてください。');
  if (!token) return say('ng','合鍵が空です。');
  if (!file)  return say('ng','ファイル名が空です。');
  if (!/\.html?$/i.test(file)) file += '.html';

  persist();
  $('#send').disabled = true;
  const result = await deposit(repo, token, file, html);
  if (result.ok){
    say('wait','台帳への記帳は Actions が終わり次第（およそ1分）反映されます。');
    $('#html').value = ''; $('#name').value = ''; $('#preview').innerHTML = '';
  }
  $('#send').disabled = false;
});

/* ── ファイルから選ぶ（複数可） ───────────────────────── */

let queue = [];
let qid = 1;
let sending = false;

$('#filePick').addEventListener('change', async (e) => {
  const files = [...e.target.files];
  e.target.value = '';
  for (const f of files){
    if (!/\.html?$/i.test(f.name) && f.type !== 'text/html'){
      say('ng', `${f.name} はHTMLではないようです。スキップしました。`);
      continue;
    }
    let html;
    try { html = await f.text(); }
    catch { say('ng', `${f.name} を読み込めませんでした。`); continue; }

    const mf = readManifest(html);
    const title = pickTitle(html);
    const base = f.name.replace(/\.html?$/i, '');
    const name = (mf && !mf.__broken && mf.name) || title.split(/[|—–\-/／｜]/)[0].trim() || base || '（名称不明）';
    const desc = (mf && !mf.__broken && mf.desc) || pickDesc(html) || '摘要未記入';
    const cat  = (mf && !mf.__broken && mf.category) || '未分類';
    const file = (base || slug(title) || ('kikai-' + qid)) + '.html';

    queue.push({ id: qid++, file, html, name, desc, cat, status: 'pending' });
  }
  renderQueue();
});

function renderQueue(){
  const box = $('#queue');
  if (!queue.length){
    box.innerHTML = '';
    $('#queueActions').hidden = true;
    return;
  }
  box.innerHTML = queue.map((q) => `
    <li class="qitem ${q.status === 'ok' ? 'ok' : q.status === 'ng' ? 'ng' : ''}">
      <div class="qhead">
        <span class="qname">${esc(q.name)}</span>
        <button class="qremove" data-remove="${q.id}" aria-label="外す" ${sending ? 'disabled' : ''}>×</button>
      </div>
      <p class="qdesc">${esc(q.desc)} ／ ${esc(q.cat)}</p>
      <div class="qfile">
        <label>ファイル名</label>
        <input data-file="${q.id}" value="${esc(q.file)}" autocapitalize="off" autocorrect="off" spellcheck="false" ${sending || q.status === 'ok' ? 'disabled' : ''}>
      </div>
      ${q.status === 'ok'      ? '<p class="qstatus ok">投函済み</p>' : ''}
      ${q.status === 'ng'      ? `<p class="qstatus ng">失敗： ${esc(q.error || '')}</p>` : ''}
      ${q.status === 'sending' ? '<p class="qstatus wait">投函中…</p>' : ''}
    </li>`).join('');

  $('#queueActions').hidden = false;
  const pending = queue.filter((q) => q.status !== 'ok').length;
  $('#queueSend').textContent = pending ? `${pending}件を投函する` : '投函済み';
  $('#queueSend').disabled = sending || pending === 0;
}

$('#queue').addEventListener('click', (e) => {
  const rm = e.target.closest('[data-remove]');
  if (!rm) return;
  queue = queue.filter((q) => q.id !== +rm.dataset.remove);
  renderQueue();
});
$('#queue').addEventListener('input', (e) => {
  const el = e.target.closest('[data-file]');
  if (!el) return;
  const q = queue.find((q) => q.id === +el.dataset.file);
  if (q) q.file = el.value.trim();
});
$('#queueClear').addEventListener('click', () => { queue = []; renderQueue(); });

$('#queueSend').addEventListener('click', async () => {
  const repo  = $('#repo').value.trim();
  const token = $('#token').value.trim();

  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) return say('ng','書庫の書き方が違います。「ユーザ名/リポジトリ名」で入れてください。');
  if (!token) return say('ng','合鍵が空です。');
  persist();

  $('#log').innerHTML = '';
  sending = true;
  $('#queueClear').disabled = true;
  renderQueue();

  for (const q of queue){
    if (q.status === 'ok') continue;
    if (!q.file){ q.status = 'ng'; q.error = 'ファイル名が空です。'; renderQueue(); continue; }
    if (!/\.html?$/i.test(q.file)) q.file += '.html';
    q.status = 'sending'; renderQueue();
    const result = await deposit(repo, token, q.file, q.html);
    q.status = result.ok ? 'ok' : 'ng';
    q.error = result.error;
    renderQueue();
  }

  say('wait','台帳への記帳は Actions が終わり次第（およそ1分）反映されます。');
  sending = false;
  $('#queueClear').disabled = false;
  renderQueue();
});

/* ── 在庫（更新・削除） ───────────────────────────────── */

const fmtBytes = (n) =>
  n >= 1048576 ? (n/1048576).toFixed(1)+' MB'
: n >= 1024    ? Math.round(n/1024)+' KB'
:                n+' B';

let inventory = [];

$('#loadInv').addEventListener('click', async () => {
  const repo  = $('#repo').value.trim();
  const token = $('#token').value.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) return say('ng','書庫の書き方が違います。「ユーザ名/リポジトリ名」で入れてください。');
  if (!token) return say('ng','合鍵が空です。');
  persist();

  $('#loadInv').disabled = true;
  $('#inv').innerHTML = '';
  try {
    const res = await api(repo, token, 'apps');
    if (res.status === 404){ say('wait','apps/ がまだ無いようです。何か投函すると出来ます。'); return; }
    if (res.status === 401) throw new Error('合鍵が通りません（401）。トークンを確認してください。');
    if (!res.ok) throw new Error(`一覧を読めません（${res.status}）`);

    const list = await res.json();
    inventory = list
      .filter((f) => f.type === 'file' && /\.html?$/i.test(f.name) && !f.name.startsWith('_'))
      .sort((a, b) => a.name.localeCompare(b.name, 'ja'))
      .map((f) => ({ name: f.name, path: f.path, sha: f.sha, size: f.size }));
    renderInv();
    if (!inventory.length) say('wait','apps/ に器械がありません。');
  } catch (err) {
    say('ng', '一覧を読み込めませんでした： ' + err.message);
  } finally {
    $('#loadInv').disabled = false;
  }
});

function renderInv(){
  $('#inv').innerHTML = inventory.map((it) => `
    <li class="iitem" data-path="${esc(it.path)}">
      <span class="iname">${esc(it.name)}</span>
      <span class="isize">${fmtBytes(it.size)}</span>
      <div class="iacts">
        <button class="ghost" data-upd-name="${esc(it.name)}" type="button">更新</button>
        <button class="ghost danger" data-del-path="${esc(it.path)}" data-del-sha="${esc(it.sha)}" data-del-name="${esc(it.name)}" type="button">削除</button>
      </div>
    </li>`).join('');
}

$('#inv').addEventListener('click', async (e) => {
  const upd = e.target.closest('[data-upd-name]');
  if (upd){
    $('#name').value = upd.dataset.updName;
    $('#html').value = '';
    $('#preview').innerHTML = '';
    $('#send').disabled = true;
    $('#html').scrollIntoView({ behavior:'smooth', block:'center' });
    $('#html').focus();
    say('wait', `「${upd.dataset.updName}」を更新する準備をしました。新しいHTMLを貼るか、ファイルから同じ名前で選んで投函してください。`);
    return;
  }

  const del = e.target.closest('[data-del-path]');
  if (del){
    const path = del.dataset.delPath, sha = del.dataset.delSha, name = del.dataset.delName;
    if (!confirm(`「${name}」を削除します。取り消せません。よろしいですか？`)) return;

    const repo  = $('#repo').value.trim();
    const token = $('#token').value.trim();
    if (!token) return say('ng','合鍵が空です。');

    del.disabled = true;
    say('wait', `${path} を削除中…`);
    try {
      const res = await api(repo, token, path, {
        method: 'DELETE',
        body: JSON.stringify({ message: `除籍: ${name}`, sha }),
      });
      if (!res.ok){
        const body = await res.json().catch(() => ({}));
        throw new Error(`${res.status} ${body.message || res.statusText}`);
      }
      say('ok', `削除しました： ${path}`);
      say('wait','台帳への記帳は Actions が終わり次第（およそ1分）反映されます。');
      inventory = inventory.filter((it) => it.path !== path);
      renderInv();
    } catch (err) {
      say('ng', `${path} を削除できませんでした： ` + err.message);
      del.disabled = false;
    }
  }
});
})();
</script>
</body>
</html>
